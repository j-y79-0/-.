<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 선생님 추천</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #666666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .result-box {
            background-color: #eef2f7;
            border-radius: 15px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .teacher-name {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            opacity: 1;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .teacher-name.fade-out {
            opacity: 0;
            transform: scale(0.9);
        }

        .teacher-name.fade-in {
            opacity: 1;
            transform: scale(1);
        }

        .btn-recommend {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-recommend:hover {
            background-color: #357abd;
        }

        .btn-recommend:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>오늘의 선생님 추천</h1>
        <p class="subtitle">버튼을 눌러 오늘의 선생님을 확인해보세요!</p>
        
        <div class="result-box">
            <div id="teacherResult" class="teacher-name">???</div>
        </div>

        <button class="btn-recommend" onclick="recommendTeacher()">선생님 추천</button>
    </div>

    <script>
        // 선생님 명단 배열
        const teachers = [
            "소연쌤", "민아쌤", "지수쌤", "권이담쌤", "최은영쌤", 
            "이숙경쌤", "안다솔쌤", "한상미쌤", "양현호쌤", "조예진쌤", 
            "박지연쌤", "배성님쌤", "이은정쌤", "박종현쌤", "최인석쌤", 
            "장민석쌤", "우단해쌤", "박하나쌤", "박지영쌤", "김윤정쌤", 
            "안세경쌤", "오혜민쌤", "허유정쌤", "조일경쌤", "정지윤쌤", 
            "신은아쌤", "한나경쌤", "클로이쌤", "싸울쌤", "이다혜쌤", 
            "정승민쌤", "조숭희쌤"
        ];

        function recommendTeacher() {
            const resultElement = document.getElementById('teacherResult');
            
            // 페이드 아웃 애니메이션
            resultElement.classList.add('fade-out');

            setTimeout(() => {
                // 랜덤으로 선생님 한 명 선택
                const randomIndex = Math.floor(Math.random() * teachers.length);
                const selectedTeacher = teachers[randomIndex];

                // 텍스트 교체
                resultElement.textContent = selectedTeacher;

                // 페이드 인 애니메이션
                resultElement.classList.remove('fade-out');
                resultElement.classList.add('fade-in');
            }, 150);
        }
    </script>

</body>
</html>
